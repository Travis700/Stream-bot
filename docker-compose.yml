services:
  clipper:
    build: .
    command: python -m clipper
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "${FILE_SERVER_PORT:-8080}:${FILE_SERVER_PORT:-8080}"
    depends_on: [ollama]
    restart: unless-stopped

  rater:
    build: .
    command: python -m rater
    env_file: .env
    volumes:
      - ./data:/data
    depends_on: [ollama]
    restart: unless-stopped

  # Free local AI (used when LLM_PROVIDER=ollama). Models download automatically on first use.
  # Not exposed to the internet; only the bots can reach it.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=2
    restart: unless-stopped
